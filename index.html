<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sunburst</title>
    <meta name="description" content="Sunburst: un sol de rayos metálicos que gira alrededor de un agujero. Un experimento de VERTIK." />
  </head>
  <body>
    <!-- Como un cartel: arriba, el símbolo; en medio, el recuadro con los
         rayos; abajo, el pie entre dos líneas. -->
    <header class="top">
      <!-- En la web de VERTIK, aquí va su símbolo. -->
      <a class="brand" href="https://www.vertik.net/">VERTIK</a>
    </header>

    <main class="panel">
      <canvas data-sunburst aria-label="Sunburst: rayos de metal en zigzag que giran alrededor de un agujero negro" role="img"></canvas>
    </main>

    <footer class="foot">
      <p>
        <span class="foot__tag">sunburst</span>
        El agujero te sigue, sin prisa. Doble toque para empezar de nuevo<span class="foot__sep">·</span><wbr />Homenaje a la portada de Death in Space, 2021
      </p>
    </footer>

    <!-- Un módulo: Vite sigue sus «import» y sirve Three.js desde node_modules. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
